<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf9"><title>Акселератор ПР · Навигатор по программе</title><link rel="stylesheet" href="style.css?v=20261027-block-chevron"></head>
